<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 颜值大检定</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f7f6; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; }
        #preview { max-width: 300px; margin-top: 20px; border-radius: 10px; display: none; }
        #result { margin-top: 20px; font-size: 24px; color: #333; }
        .score { font-size: 48px; color: #ff4757; font-weight: bold; }
        .upload-label { background-color: #00b894; color: white; padding: 10px 25px; border-radius: 5px; cursor: pointer; display: inline-block; }
        button { background-color: #1e90ff; color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ AI 颜值大检定 ✨</h1>
        <p>上传照片，看看你的魅力值！</p>
        
        <!-- 使用 Label 触发隐藏的 input -->
        <label for="fileInput" class="upload-label">选择照片</label>
        <input type="file" id="fileInput" accept="image/*">
        
        <br>
        <img id="preview" src="" alt="预览图">
        <br>
        
        <button id="detectBtn" onclick="detectFace()">开始检定</button>
        <div id="result"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');

        // 彻底修复 createObjectURL 报错的关键
        fileInput.onchange = function() {
            // 必须使用  获取具体文件对象
            if (this.files && this.files) {
                const file = this.files;
                
                // 校验大小：百度 API 要求 Base64 编码后的图片小于 2M
                if (file.size > 2 * 1024 * 1024) {
                    alert("图片太大了，请上传 2MB 以内的图片");
                    this.value = ''; // 清空选择
                    return;
                }

                // 释放之前的 URL 以节省内存
                if (preview.src) URL.revokeObjectURL(preview.src);
                
                // 正确生成预览 URL
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                resultDiv.innerHTML = ""; 
            }
        };

        async function detectFace() {
            // 这里的 fileInput.files 也是关键
            if (!fileInput.files || !fileInput.files) {
                alert("请先选择一张照片！");
                return;
            }

            resultDiv.innerHTML = "正在努力计算中... ⏳";
            const file = fileInput.files;
            const reader = new FileReader();

            reader.readAsDataURL(file);
            reader.onload = async function() {
                // 百度 API 只需要逗号后的 Base64 纯数据 [1]
                const base64Data = reader.result.split(',')[2];

                try {
                    // 请求 Netlify Functions 后端路径
                    const response = await fetch('/.netlify/functions/detect', {
                        method: 'POST',
                        body: JSON.stringify({ image: base64Data })
                    });
                    
                    const data = await response.json();

                    if (data.error_code === 0 && data.result) {
                        // 提取来源中提到的 beauty 字段 [3, 4]
                        const beauty = data.result.face_list.beauty;
                        resultDiv.innerHTML = `您的颜值分数为：<br><span class="score">${beauty}</span> / 100`;
                    } else {
                        // 处理常见错误码，如 222202 (未检测到人脸) [5, 6]
                        let errorMsg = data.error_msg || "检测失败";
                        if (data.error_code === 222202) errorMsg = "图中没有人脸，请换一张试试";
                        resultDiv.innerHTML = `<span style="color:red;">❌ ${errorMsg}</span>`;
                    }
                } catch (error) {
                    resultDiv.innerHTML = `<span style="color:red;">服务器连接出错，请检查部署。</span>`;
                }
            };
        }
    </script>
</body>
</html>
